# Render Blueprint: one free web service. https://render.com/docs/blueprint-spec
# Secrets use `sync: false`, so Render asks for their values in the dashboard;
# none are stored in this file.
services:
  - type: web
    name: sentinel
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24.14.0"
      # PayPal: merchant sandbox app
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      # PayPal: agent operator sandbox app (Payouts enabled)
      - key: PAYPAL_OPERATOR_CLIENT_ID
        sync: false
      - key: PAYPAL_OPERATOR_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_EMAIL
        sync: false
      # Set after the first deploy, once the webhook for <service-url>/api/webhooks/paypal exists
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Gemini
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ARBITER_CONFIDENCE_THRESHOLD
        value: "0.7"
